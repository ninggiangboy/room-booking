name: CI

# Four stages, all required on every pull request: Build, Unit Test, Code Quality, Security Scan.
# The build/test/quality stages run the same commands
# room-booking-backend/docs/conventions/07-workflow-and-commits.md documents as the definition of
# done -- one definition, read by a person before opening a pull request and enforced here as the
# merge gate, never two definitions that can drift apart. See room-booking-infra/docs/cicd.md.

on:
  pull_request:
    paths:
      - "room-booking-backend/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "room-booking-backend/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-quality:
    name: Build, test, and code quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: room-booking-backend
    steps:
      - uses: actions/checkout@v5
        with:
          # git diff --check below needs the PR's base commit, which a shallow (depth-1) checkout
          # doesn't have.
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('room-booking-backend/**/*.gradle*', 'room-booking-backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: git diff --check (pull requests only)
        if: github.event_name == 'pull_request'
        run: git -C .. diff --check ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}

      # --- Build ---
      - name: ./gradlew build
        run: ./gradlew build

      # --- Unit Test --- (already run by `build` above via `check`; named separately so a test
      # failure reads clearly as a Unit Test failure, not a generic build failure)
      - name: ./gradlew test
        run: ./gradlew test

      # --- Code Quality --- SpotBugs (incl. find-sec-bugs) and PMD, also wired into `check` above
      # and therefore already run by `build`; named separately for the same reason, and because
      # this is where results get surfaced -- see build.gradle for why findings don't fail the
      # build yet (ignoreFailures = true on both).
      - name: ./gradlew spotbugsMain pmdMain
        run: ./gradlew spotbugsMain pmdMain

      - name: ./gradlew javadoc
        run: ./gradlew javadoc

      - name: Upload SARIF for code scanning (best-effort)
        # Requires GitHub code scanning to be available for this repository (GitHub Advanced
        # Security on a private repo, or any visibility on a public one) -- not assumed here, so
        # this step is never allowed to fail the job. The HTML/SARIF reports below are uploaded as
        # plain build artifacts regardless, so quality results are visible either way.
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: room-booking-backend/build/reports/spotbugs/main.sarif

      - name: Upload quality and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-and-test-reports
          path: |
            room-booking-backend/build/reports/tests
            room-booking-backend/build/reports/spotbugs
            room-booking-backend/build/reports/pmd
          retention-days: 14

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Dependency vulnerability scan against the Gradle lockfile / build files. `exit-code: 1`
      # fails the job on HIGH/CRITICAL findings -- unlike the code-quality stage, a known-vulnerable
      # dependency is a hard gate from day one, not a baseline to tighten into later.
      - name: Dependency vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: room-booking-backend
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
