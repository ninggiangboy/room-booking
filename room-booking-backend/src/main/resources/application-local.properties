# Local PostgreSQL matches the credentials and port in compose.local.yaml.
spring.datasource.url=jdbc:postgresql://localhost:5432/room_booking
spring.datasource.username=room_booking
spring.datasource.password=room_booking
spring.datasource.driver-class-name=org.postgresql.Driver

# Mailpit accepts SMTP locally without authentication or TLS.
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
# Development-only 256-bit Base64 key. Override JWT_SECRET outside the local profile.
security.jwt.secret=${JWT_SECRET:bG9jYWwtZGV2ZWxvcG1lbnQta2V5LW11c3QtYmUtMzItYnl0ZXMh}
# Development-only 256-bit Base64 AES key, distinct from the JWT signing key above. Override
# SECRET_BOX_KEY outside the local profile.
app.secret-box.key=${SECRET_BOX_KEY:bG9jYWwtZGV2LXNlY3JldC1ib3gta2V5LTMyYnl0ZSE=}
