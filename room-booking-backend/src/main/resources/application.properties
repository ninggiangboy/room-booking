# Shared application identity and Liquibase migration entry point.
spring.application.name=room-booking-backend
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Springdoc serves an interactive UI and machine-readable JSON/YAML API contracts.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Environment-specific profiles must provide the PostgreSQL connection values.
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver
# Every session evaluates CURRENT_DATE and timestamptz casts in UTC, independent of the host and of
# any role-level default, so server-side date expressions cannot drift between environments.
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'

# Timestamps leave the API as UTC ISO-8601 instants; a stay date is a plain local date and must
# never be serialized as an instant. See docs/features/date-time-and-time-zone-handling.md.
spring.jackson.time-zone=UTC
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

# Mail transport is deliberately blank here and configured per environment.
spring.mail.host=
spring.mail.port=
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Verification emails link to the frontend and expire after the configured duration.
app.email-verification.url=${EMAIL_VERIFICATION_URL:http://localhost:3000/verify-email}
app.email-verification.token-ttl=24h
app.email-verification.request-cooldown=60s
app.email-verification.rate-limit-window=1h
app.email-verification.rate-limit-max-requests=5

# Password-reset emails use short-lived, single-use tokens.
app.password-reset.url=${PASSWORD_RESET_URL:http://localhost:3000/reset-password}
app.password-reset.token-ttl=30m

# Production must inject a Base64-encoded signing secret of at least 256 bits.
security.jwt.secret=
security.jwt.access-token-expiration=15m
security.jwt.refresh-token-expiration=30d
