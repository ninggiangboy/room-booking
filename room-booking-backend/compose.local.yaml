name: room-booking-local

services:
  # PostgreSQL with PostGIS stores relational and spatial data; its volume survives recreation.
  postgres:
    image: postgis/postgis:17-3.6-alpine
    # The upstream PostGIS image is currently amd64-only; Docker Desktop emulates it on Apple Silicon.
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: room_booking
      POSTGRES_USER: room_booking
      POSTGRES_PASSWORD: room_booking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U room_booking -d room_booking"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # MinIO provides S3-compatible object storage for future listing images.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Mailpit captures development email and displays it in a browser instead of delivering it.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  # Named volumes keep local database and object-storage data between runs.
  postgres_data:
  minio_data:
