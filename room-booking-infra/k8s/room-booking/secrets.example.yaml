# Templates, not real secrets -- never apply this file as-is. Copy, fill in real values (or
# generate with `kubectl create secret generic ... --from-literal=...` instead of editing a file at
# all), and never commit the filled-in version. Mirrors deploy/.env.example's keys -- see
# docs/configuration-and-secrets.md.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  DATASOURCE_USERNAME: room_booking
  DATASOURCE_PASSWORD: __CHANGE_ME__
  SMTP_HOST: __CHANGE_ME__
  SMTP_PORT: "587"
  SMTP_USERNAME: __CHANGE_ME__
  SMTP_PASSWORD: __CHANGE_ME__
  SMTP_AUTH: "true"
  SMTP_STARTTLS: "true"
  JWT_SECRET: __CHANGE_ME__
  SECRET_BOX_KEY: __CHANGE_ME__
  EMAIL_VERIFICATION_URL: https://__APP_HOSTNAME__/verify-email
  PASSWORD_RESET_URL: https://__APP_HOSTNAME__/reset-password
  OTLP_ENDPOINT: https://otel.__DOMAIN__
  OTLP_AUTH_HEADER: "Basic __BASE64_USERNAME_COLON_PASSWORD__"
  OTLP_SAMPLE_RATE: "0.1"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  DEPLOY_ENV: dev # dev | staging | production -- one manifest set per environment/namespace
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
type: Opaque
stringData:
  POSTGRES_DB: room_booking
  POSTGRES_USER: room_booking
  POSTGRES_PASSWORD: __CHANGE_ME__
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-secrets
type: Opaque
stringData:
  MINIO_ROOT_USER: __CHANGE_ME__
  MINIO_ROOT_PASSWORD: __CHANGE_ME__
