# The application, following room-booking-infra/docs/service-contract.md's template. Image tag is
# templated (${IMAGE_TAG}) rather than hardcoded -- substitute before `kubectl apply`, e.g.
#   envsubst < deployment.yaml | kubectl apply -f -
# following the same "one artifact, promoted" rule as deploy/compose.deploy.yaml
# (docs/release-and-rollback.md). Namespace is created by `kubectl create namespace room-booking`
# (or a per-environment variant, e.g. room-booking-staging) before applying anything here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app.kubernetes.io/name: room-booking-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: room-booking-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: room-booking-backend
    spec:
      containers:
        - name: app
          image: ghcr.io/__ORG__/room-booking-backend:${IMAGE_TAG}
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: app-secrets
          env:
            - name: DEPLOY_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DEPLOY_ENV
            - name: DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/room_booking
            - name: OTLP_METRICS_PUSH_ENABLED
              value: "false" # metrics arrive by scrape (docs/observability.md), matching deploy/
          # The scoped probe paths, not plain /actuator/health -- confirmed empirically during
          # Kubernetes verification that plain /actuator/health aggregates every registered health
          # indicator, including Boot's default MailHealthIndicator (spring-boot-starter-mail is on
          # the classpath). With SMTP briefly unreachable, plain /actuator/health returned 503 even
          # though the process was healthy and serving HTTP traffic fine -- pointing livenessProbe
          # at it would restart a perfectly good pod over a transient SMTP blip. /health/liveness
          # reports only the process's own LivenessState; /health/readiness includes the external
          # dependencies that genuinely mean "not ready for traffic" (datasource, disk space) but
          # still needs auditing for whether mail belongs there either -- see docs/observability.md.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  selector:
    app.kubernetes.io/name: room-booking-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
