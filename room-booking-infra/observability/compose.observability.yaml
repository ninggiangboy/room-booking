# The central observability host: every deployed environment (dev/staging/production) sends
# traces, metrics, and logs here -- one stack instead of three, see
# room-booking-infra/docs/platform-architecture.md. Separate production-grade components, not the
# dev-only grafana/otel-lgtm image used by the local environments (docs/conventions.md rule 7).
name: room-booking-observability

services:
  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d

  loki:
    image: grafana/loki:3.7.7
    restart: unless-stopped
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: ["-config.file=/etc/loki/local-config.yaml"]

  tempo:
    image: grafana/tempo:2.9.0
    restart: unless-stopped
    volumes:
      - ./tempo/tempo-config.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    command: ["-config.file=/etc/tempo.yaml"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    restart: unless-stopped
    volumes:
      - ./otel-collector/otel-collector-config.yaml:/etc/otelcol-config.yaml:ro
    command: ["--config=/etc/otelcol-config.yaml"]
    depends_on:
      - tempo
      - loki

  grafana:
    image: grafana/grafana:13.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://${GRAFANA_HOSTNAME}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo

  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      OTEL_HOSTNAME: ${OTEL_HOSTNAME}
      LOKI_HOSTNAME: ${LOKI_HOSTNAME}
      GRAFANA_HOSTNAME: ${GRAFANA_HOSTNAME}
      INGEST_AUTH_USERNAME: ${INGEST_AUTH_USERNAME}
      INGEST_AUTH_PASSWORD_HASH: ${INGEST_AUTH_PASSWORD_HASH}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - otel-collector
      - loki
      - grafana

volumes:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
  caddy_data:
  caddy_config:
