# Monolithic mode -- one process, matching Loki's single-binary mode above for the same reason
# (room-booking-infra/docs/platform-architecture.md). Receives traces from the OTel Collector.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 336h # 14 days -- operational telemetry, not backed up (docs/observability.md)

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
